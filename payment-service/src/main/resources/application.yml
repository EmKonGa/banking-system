spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/banking_db?currentSchema=banking_payment
    username: ${DB_USER:banking_user}
    password: ${DB_PASSWORD:banking_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    schemas: banking_payment
    default-schema: banking_payment

  jpa:
    # Hold the JDBC connection only for the service call, not until the response is written.
    # With OSIV on, a request that calls account-service over Feign pins one of the 10 pool
    # slots across that network hop.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: banking_payment

  cloud:
    openfeign:
      client:
        config:
          account-service:
            # Feign's defaults are 10s connect and 60s read (feign.Request.Options), and nothing
            # overrode them. Both are wrong for an internal call on the money path.
            #
            # connect-timeout: inside the cluster a healthy pod completes a TCP handshake in single
            # digit milliseconds, so 2s is generous and anything slower is a pod that is gone. It
            # also bounds the retries that ConnectFailurePredicate now allows: three attempts cost
            # at most ~7.5s including backoff, where the old default would have made that ~33s.
            #
            # read-timeout: this is the judgment call. The remote work is two row locks, two updates
            # and an insert -- well under a second in practice -- so 15s is ~100x headroom while
            # capping what a single transfer can hold a request thread for. The trade is real: a
            # transfer that would have completed at 20s now surfaces as indeterminate and is left
            # PENDING for TransferRecoveryPoller. That is the safe direction (nothing is written
            # off, the poller establishes the outcome) and it stays well inside the poller's 60s
            # grace period, but it does mean a genuinely slow account-service produces PENDING
            # intents rather than slow successes. Raise it if that trade ever looks wrong.
            connect-timeout: ${ACCOUNT_CLIENT_CONNECT_TIMEOUT_MS:2000}
            read-timeout: ${ACCOUNT_CLIENT_READ_TIMEOUT_MS:15000}

  task:
    scheduling:
      # Spring Boot's default is 1, and this service has two @Scheduled methods that must not be
      # able to block each other: OutboxPoller.pollAndPublish (15s) and
      # TransferRecoveryPoller.settleStrandedTransfers (30s).
      #
      # The poll is the one that blocks. It awaits a broker ack per row over a batch of up to ten,
      # so with Kafka reachable but not acking a single pass can hold its thread for minutes. On one
      # thread that silently stopped the recovery poller — a Kafka outage disabling the mechanism
      # that settles money whose outcome payment-service never learned. Two unrelated safety nets,
      # one of them switched off by the other's dependency, and nothing in either file said so.
      #
      # Raise this with the number of @Scheduled methods, not with load: the point is one thread per
      # task that can block for a long time, so no task waits on another's dependency.
      pool:
        size: 2

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_pass}
      connect-timeout: 3s
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1s
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
        max.block.ms: 5000

server:
  port: 8083

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-must-be-long-enough}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

internal:
  secret: ${INTERNAL_SECRET:internal-secret-change-me}

outbox:
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:15000}
  max-retries: ${OUTBOX_MAX_RETRIES:5}
  base-backoff-seconds: ${OUTBOX_BASE_BACKOFF_SECONDS:15}

transfer:
  recovery:
    poll-interval-ms: ${TRANSFER_RECOVERY_POLL_INTERVAL_MS:30000}
    grace-period-seconds: ${TRANSFER_RECOVERY_GRACE_PERIOD_SECONDS:60}
    write-off-seconds: ${TRANSFER_RECOVERY_WRITE_OFF_SECONDS:900}

kafka:
  publish:
    ack-timeout-ms: ${KAFKA_PUBLISH_ACK_TIMEOUT_MS:35000}

services:
  account-service:
    url: ${ACCOUNT_SERVICE_URL:http://host.docker.internal:8080}

logging:
  level:
    org.apache.kafka.clients.NetworkClient: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,retries
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_ENDPOINT:http://localhost:4318/v1/traces}

resilience4j:
  circuitbreaker:
    instances:
      redis:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        record-exceptions:
          - org.springframework.data.redis.RedisConnectionFailureException
          # record-exceptions is a whitelist — anything unlisted counts as a SUCCESS. Spring Data
          # translates Lettuce's RedisCommandTimeoutException into QueryTimeoutException, so
          # without this entry the most common Redis failure (server reachable but unresponsive)
          # never opened the breaker.
          - org.springframework.dao.QueryTimeoutException
          - io.lettuce.core.RedisException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
        ignore-exceptions:
          - com.banking.common.exception.AppException
      kafka-producer:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        slow-call-duration-threshold: 5s
        record-exceptions:
          - org.apache.kafka.common.KafkaException
          - org.apache.kafka.common.errors.TimeoutException
          - org.apache.kafka.common.errors.RetriableException
          - org.springframework.kafka.KafkaException
      account-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        # java.net.ConnectException was listed here too and removed for the same reason it was wrong
        # in the retry below: Feign wraps it in RetryableException and never throws it directly. The
        # breaker was never affected — RetryableException extends FeignException, so the first entry
        # already records every transport failure — but a dead entry that appears to do something is
        # how the retry's version went unnoticed for so long.
        record-exceptions:
          - feign.FeignException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - com.banking.common.exception.AppException

  retry:
    instances:
      redis:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        exponential-max-wait-duration: 3s
        # QueryTimeoutException is deliberately absent here even though the breaker records it:
        # the command already waited out the full timeout, so retrying turns 2s into 6s. Let the
        # breaker open instead.
        retry-exceptions:
          - org.springframework.data.redis.RedisConnectionFailureException
          - io.lettuce.core.RedisException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - com.banking.common.exception.AppException
      account-service:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        exponential-max-wait-duration: 5s
        # A predicate, not a class list, because the question is not "which exception type" but
        # "does this failure prove the request never arrived". Feign wraps every IOException in
        # RetryableException and Resilience4j matches concrete classes without unwrapping causes, so
        # the java.net.ConnectException entry that used to sit here could never match — @Retry
        # retried nothing, and a rolling restart of account-service stranded transfers as PENDING
        # intents. See ConnectFailurePredicate for why adding feign.RetryableException instead would
        # have been worse: it also covers read timeouts, where the money may already have moved.
        #
        # OR'd with retry-exceptions below (RetryConfig.createRetryOnExceptionPredicate), not
        # replacing it.
        retry-exception-predicate: com.banking.payment.resilience.ConnectFailurePredicate
        # Kept: this one is a real HTTP 503 from account-service, not a transport failure, and it
        # does match what the runtime throws.
        retry-exceptions:
          - feign.FeignException.ServiceUnavailable
        ignore-exceptions:
          - com.banking.common.exception.AppException
          - feign.FeignException.BadRequest
          - feign.FeignException.UnprocessableEntity
