groups:
  - name: reconciliation
    rules:
      # ---------------------------------------------------------------------------------------
      # The system says money is wrong.
      # ---------------------------------------------------------------------------------------

      # No `for:` clause, deliberately. A CONFIRMED finding has already survived two independent
      # sweeps — ten minutes at the default interval — which is exactly the debounce a `for:` would
      # add, and it is a better debounce: it filters on the discrepancy still being real rather than
      # on the alert still being loud. SUSPECTED is not alerted on at all; most first sightings are
      # money that was in flight while the two sides were read.
      - alert: ReconciliationConfirmedDiscrepancy
        expr: reconciliation_confirmed_findings > 0
        labels:
          severity: critical
        annotations:
          summary: "Account balances disagree with the ledger ({{ $value }} confirmed)"
          description: >-
            A discrepancy has survived two consecutive sweeps, so it is not an artefact of a transfer
            committing mid-sweep. GET /api/reconciliation/findings (ADMIN) for the subjects and
            amounts. The reconciler only ever reports — nothing has been or will be auto-corrected.

      # ---------------------------------------------------------------------------------------
      # The system cannot say whether money is wrong. This is the more dangerous state: the two
      # gauges above are read from the findings register, so when sweeps stop they hold whatever was
      # last true. A clean register plus a dead sweeper is indistinguishable from a healthy system.
      # ---------------------------------------------------------------------------------------

      # Covers the sweeper failing while the process is still up and scraping: the key-set ceiling,
      # account-service unreachable, an unhandled bug in a pass. An aborted sweep records nothing at
      # all, which is what leaves this timestamp behind.
      #
      # 1800s is six missed sweeps at the default 300s interval — long enough that a single
      # dependency blip does not page, short enough that the auditor is never quietly off for an hour.
      - alert: ReconciliationSweeperStopped
        expr: time() - reconciliation_last_successful_sweep_timestamp_seconds > 1800
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Reconciliation sweeps have stopped completing"
          description: >-
            No sweep has finished in over 30 minutes, so nothing is currently checking balances
            against the ledger. Findings gauges are stale and must not be read as healthy. Check
            reconciliation-service logs for "[RECON] sweep aborted" and for the max-keys ceiling
            warning, which makes every subsequent sweep abort until a C2 watermark is added.
            A value of 0 means no sweep has *ever* completed — expected briefly after a first deploy.

      # The gap the rule above cannot cover. If the process is down or unscrapable, the gauge is not
      # ingested at all; Prometheus serves the last sample for 5 minutes and then marks the series
      # stale, at which point `time() - <gauge>` returns no data and the staleness alert silently
      # stops firing. A hard-down auditor would otherwise be the quietest failure of the three.
      - alert: ReconciliationServiceDown
        expr: up{job="reconciliation-service"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "reconciliation-service is not being scraped"
          description: >-
            The auditor is down or unreachable. Nothing is checking that balances match the ledger,
            and the staleness alert cannot fire while its own metric is absent.

  - name: event-delivery
    rules:
      # ---------------------------------------------------------------------------------------
      # A transfer happened and nobody told the user.
      #
      # Note what these do NOT cover, because the reconciler above looks like it should: an
      # abandoned event or a dead-lettered one leaves the money entirely correct. The balance
      # matches, the ledger row says COMPLETED, and a sweep reports the system clean -- accurately.
      # Delivery failures are invisible to every invariant reconciliation checks, which is why they
      # need their own two rules rather than being folded into the group above.
      # ---------------------------------------------------------------------------------------

      # No `for:` clause. This gauge counts rows in a terminal state -- OutboxPoller gave up on them
      # and findPendingWithLock will never select them again -- so the condition cannot resolve on
      # its own and waiting adds delay without adding confidence. It is the opposite case from
      # ReconciliationSuspected, where waiting is what separates artefact from breakage.
      #
      # max() rather than a bare comparison: payment-service is one replica today, but the value is
      # read from the shared database, so every replica reports the same number and a bare
      # comparison would fire once per pod for one problem.
      - alert: OutboxEventsAbandoned
        expr: max(payment_outbox_abandoned_events) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} payment event(s) will never be delivered"
          description: >-
            OutboxPoller exhausted outbox.max-retries (default 5, roughly 450s of backoff) and set
            these rows FAILED. Nothing retries or replays a FAILED row -- the at-least-once
            guarantee the outbox provides is bounded by that retry count, and this is what crossing
            the bound looks like. The money is fine and reconciliation will report clean; what was
            lost is the notification. Recover by hand:
            UPDATE outbox_events SET status='PENDING', retry_count=0, next_retry_at=NULL,
            last_error=NULL WHERE status='FAILED'; -- safe because the consumer is idempotent on
            processed_events, so a redelivery of an event that did somehow arrive is a no-op.

      # A counter, so this asks "did any arrive recently" rather than "are any present" -- a
      # dead-lettered record stays on the topic forever and a gauge of topic depth would keep
      # firing long after the incident was handled. increase() also survives the pod restart that a
      # counter reset would otherwise read as negative.
      #
      # sum() across instances: notification-service runs 2 replicas and the counter is per pod.
      - alert: PaymentEventsDeadLettered
        expr: sum(increase(notification_events_dead_lettered_total[1h])) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} payment event(s) dead-lettered in the last hour"
          description: >-
            PaymentEventConsumer failed three attempts and the record was parked on
            payment.events.DLT. The transfer itself completed -- this is a user who was not told.
            Read the payload from payment.events.DLT; a deserialization failure is republished as
            the original bytes and a handler failure as JSON, so the two are distinguishable.

      # The gap neither rule above can cover, and the same reasoning as ReconciliationServiceDown:
      # if the process is not scraped its series goes stale, `max()` and `increase()` return no
      # data, and both rules silently stop evaluating. A hard-down service is the quietest failure
      # in this group -- and payment-service being down also means nothing is publishing at all.
      - alert: EventDeliveryServiceDown
        expr: up{job=~"payment-service|notification-service"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is not being scraped"
          description: >-
            Events are not being published or not being consumed, and the two delivery alerts above
            cannot fire while their metrics are absent.
